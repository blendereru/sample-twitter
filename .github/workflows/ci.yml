name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Setup .NET 10
      # -----------------------------------------------------------------------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # -----------------------------------------------------------------------
      # 3. Cache NuGet packages
      #
      # Keyed on the solution file so the cache is invalidated whenever any
      # project reference or package version changes. Without this, every run
      # downloads all packages from nuget.org (~20-30s).
      # -----------------------------------------------------------------------
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # -----------------------------------------------------------------------
      # 4. Restore
      # -----------------------------------------------------------------------
      - name: Restore
        run: dotnet restore sample-twitter.slnx

      # -----------------------------------------------------------------------
      # 5. Build
      #
      # -warnaserror is intentionally NOT set: the codebase has pre-existing
      # CS8618 (nullable) and NU1903 (package vulnerability) warnings that are
      # tracked separately. Add -warnaserror once those are resolved.
      # -----------------------------------------------------------------------
      - name: Build
        run: dotnet build sample-twitter.slnx --no-restore --configuration Release

      # -----------------------------------------------------------------------
      # 6. Unit Tests + coverage collection
      #
      # --collect:"XPlat Code Coverage" activates coverlet.collector, which
      # instruments the SampleTwitter.API assembly at runtime and writes a
      # coverage.cobertura.xml file into a GUID-named subdirectory under
      # ./coverage. The GUID directory means this step and step 7 (integration
      # tests) can both write to ./coverage without overwriting each other.
      # -----------------------------------------------------------------------
      - name: Unit Tests
        run: >
          dotnet test SampleTwitter.API.UnitTests/SampleTwitter.API.UnitTests.csproj
          --no-build
          --configuration Release
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      # -----------------------------------------------------------------------
      # 7. Integration Tests + coverage collection
      #
      # Same --collect flag. coverlet merges with the existing data at report
      # generation time (not here) -- both XML files are independent snapshots.
      # -----------------------------------------------------------------------
      - name: Integration Tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: >
          dotnet test SampleTwitter.API.IntegrationTests/SampleTwitter.API.IntegrationTests.csproj
          --no-build
          --configuration Release
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      # -----------------------------------------------------------------------
      # 8. Install ReportGenerator
      #
      # ReportGenerator is installed as a global .NET tool on the runner.
      # It reads the two coverage.cobertura.xml files produced above, merges
      # them into a single combined picture, and generates two output formats:
      #   - Html        : full interactive report, uploaded as a job artifact
      #   - MarkdownSummaryGithub : one-page summary written to the job summary
      #
      # Why a global tool install and not a PackageReference?
      # ReportGenerator is a dev-time report renderer, not a library — it has
      # no API our code calls. Installing it as a tool on the CI runner keeps
      # it out of every developer's project dependencies.
      # -----------------------------------------------------------------------
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      # -----------------------------------------------------------------------
      # 9. Generate coverage report
      #
      # -reports     : glob picking up both XML files (one per test project,
      #                each in its own GUID subdirectory under ./coverage).
      # -targetdir   : output folder for the rendered report.
      # -reporttypes : Html for the artifact + MarkdownSummaryGithub for the
      #                job summary panel.
      # -assemblyfilters : +SampleTwitter.API includes only application code.
      #                    Without this, the report would include coverage of
      #                    the test projects themselves (which would always be
      #                    100% -- every test method is "covered" by running).
      # -classfilters: Excludes EF Core migration classes. They contain only
      #                auto-generated Up()/Down() scaffolding -- measuring their
      #                coverage would inflate the denominator with lines we
      #                never intend to test directly.
      # -----------------------------------------------------------------------
      - name: Generate coverage report
        run: >
          reportgenerator
          -reports:"./coverage/**/coverage.cobertura.xml"
          -targetdir:"./coverage-report"
          -reporttypes:"Html;MarkdownSummaryGithub"
          -assemblyfilters:"+SampleTwitter.API"
          -classfilters:"-*.Migrations.*"

      # -----------------------------------------------------------------------
      # 10. Write summary to the GitHub job summary panel
      #
      # MarkdownSummaryGithub produces a file called SummaryGithub.md.
      # Appending it to $GITHUB_STEP_SUMMARY makes it appear directly on the
      # Actions run page -- no need to download an artifact to see the numbers.
      # -----------------------------------------------------------------------
      - name: Write coverage summary to job summary
        run: cat ./coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      # -----------------------------------------------------------------------
      # 11. Upload full HTML report as a job artifact
      #
      # The Markdown summary shows overall line/branch/method percentages.
      # The HTML artifact shows per-file, per-class, per-line detail --
      # which specific lines are uncovered. Retained for 30 days by default.
      # -----------------------------------------------------------------------
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage-report
          retention-days: 30

      # -----------------------------------------------------------------------
      # 12. Send Telegram notification
      # Skips gracefully if secrets are not configured (e.g. in forks).
      # -----------------------------------------------------------------------
      - name: Send Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) are not configured. Skipping notification."
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="Passed"
          elif [ "$JOB_STATUS" = "failure" ]; then
            STATUS_ICON="❌"
            STATUS_TEXT="Failed"
          else
            STATUS_ICON="⚠️"
            STATUS_TEXT="Cancelled"
          fi

          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -n 1 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MESSAGE=$(cat <<EOF | sed 's/^[[:space:]]*//'
          <b>${STATUS_ICON} CI Build ${STATUS_TEXT}</b>

          <b>Repository:</b> <code>${{ github.repository }}</code>
          <b>Branch:</b> <code>${{ github.ref_name }}</code>
          <b>Author:</b> ${{ github.actor }}
          <b>Commit:</b> ${COMMIT_MSG}

          <a href="${RUN_URL}">View Workflow Run</a>
          EOF
          )

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MESSAGE}"