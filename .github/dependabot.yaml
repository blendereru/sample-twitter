version: 2
updates:
  # .NET / NuGet packages
  - package-ecosystem: "nuget"
    directory: "/SampleTwitter.API"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Vue / npm packages
  - package-ecosystem: "npm"
    directory: "/SampleTwitter.Web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5